name: OWASP ZAP API Security Test

on:
  workflow_dispatch:
    inputs:
      persistence-profile:
        description: Persistence implementation profile
        required: true
        default: doma
        type: choice
        options:
          - doma
          - jpa
          - mybatis
          - jooq

permissions:
  contents: read
  security-events: write

jobs:
  zap-api-security-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Run OWASP ZAP API scan
        env:
          PERSISTENCE_PROFILE: ${{ inputs.persistence-profile }}
          ZAP_MAX_SCAN_DURATION_MINS: '30'
        run: docker/security-tests/run-zap.sh

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: zap-api-security-test-${{ inputs.persistence-profile }}
          path: docker/security-tests/results/
          if-no-files-found: warn

      - name: Upload SARIF to Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: docker/security-tests/results/zap-api.sarif
