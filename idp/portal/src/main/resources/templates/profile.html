<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>ポータルプロフィール</title></head>
<body>
  <h1>ポータルのプロフィール</h1>
  <dl><dt>名前</dt><dd th:text="${name}">Name</dd><dt>メール</dt><dd th:text="${email}">email@example.test</dd></dl>
  <h2>OIDC クレーム</h2><pre th:text="${claims}">claims</pre>
  <form th:action="@{/logout}" method="post"><button type="submit">ログアウト</button></form>
  <p><a href="http://localhost:8082/">レポートシステムを開く</a></p>
</body>
</html>
