<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>受注CSV出力</title><link rel="stylesheet" href="/css/app.css"></head>
<body><main><header><h1>受注一覧・CSV出力</h1><form th:action="@{/logout}" method="post"><button>ログアウト</button></form></header>
<form method="get" class="filters"><label>状態 <select name="status"><option value="">すべて</option><option>NEW</option><option>PAID</option><option>SHIPPED</option><option>CANCELLED</option></select></label><label>注文日（開始）<input type="date" name="orderDateFrom"></label><label>注文日（終了）<input type="date" name="orderDateTo"></label><label>顧客名<input name="customerName"></label><label>金額（最小）<input type="number" name="amountMin"></label><label>金額（最大）<input type="number" name="amountMax"></label><button>検索</button></form>
<form th:action="@{/exports}" method="post" class="export"><input type="hidden" name="status" th:value="${filter.status}"><input type="hidden" name="orderDateFrom" th:value="${filter.orderDateFrom}"><input type="hidden" name="orderDateTo" th:value="${filter.orderDateTo}"><input type="hidden" name="customerName" th:value="${filter.customerName}"><input type="hidden" name="amountMin" th:value="${filter.amountMin}"><input type="hidden" name="amountMax" th:value="${filter.amountMax}"><button>この条件でZIPを作成</button></form>
<h2>検索結果（先頭100件）</h2><table><thead><tr><th>注文番号</th><th>顧客</th><th>商品</th><th>金額</th><th>状態</th><th>注文日時</th></tr></thead><tbody><tr th:each="o : ${orders}"><td th:text="${o.orderNumber}"></td><td th:text="${o.customerName}"></td><td th:text="${o.productName}"></td><td th:text="${o.amount}"></td><td th:text="${o.status}"></td><td th:text="${o.orderedAt}"></td></tr></tbody></table>
<h2>出力履歴</h2><table><thead><tr><th>ID</th><th>状態</th><th>件数</th><th>作成日時</th><th>取得</th></tr></thead><tbody><tr th:each="job : ${jobs}" th:attr="data-job-id=${job.id}"><td th:text="${job.id}"></td><td class="status" th:text="${job.status}"></td><td class="count" th:text="${job.recordCount}"></td><td th:text="${job.createdAt}"></td><td class="download"><a th:if="${job.status == 'COMPLETED'}" th:href="@{/exports/{id}/download(id=${job.id})}">ZIP</a></td></tr></tbody></table>
</main><script>setInterval(async()=>{for(const row of document.querySelectorAll('[data-job-id]')){const r=await fetch('/api/exports/'+row.dataset.jobId);if(!r.ok)continue;const j=await r.json();row.querySelector('.status').textContent=j.status;row.querySelector('.count').textContent=j.recordCount;const d=row.querySelector('.download');if(j.downloadable)d.innerHTML='<a href="/exports/'+j.id+'/download">ZIP</a>'; }},3000);</script></body></html>
