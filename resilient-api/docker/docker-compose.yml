name: resilient-api-local

x-app-environment: &app-environment
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-resilient_api}?useSSL=false&allowPublicKeyRetrieval=true
  SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-app}
  SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-app-password}
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: resilient-api-local:dev
  environment: *app-environment
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
    interval: 10s
    timeout: 3s
    retries: 10
    start_period: 30s

services:
  mysql:
    image: mysql:9.7.2
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-resilient_api}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8.6-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-1:
    <<: *app
    environment:
      <<: *app-environment
      SPRING_PROFILES_ACTIVE: api
      INSTANCE_ID: api-1

  api-2:
    <<: *app
    environment:
      <<: *app-environment
      SPRING_PROFILES_ACTIVE: api
      INSTANCE_ID: api-2

  worker:
    <<: *app
    environment:
      <<: *app-environment
      SPRING_PROFILES_ACTIVE: worker
      INSTANCE_ID: worker-1

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/actuator/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
